name: Release

# Native installers (deb, msi, dmg for Apple silicon and Intel) and per-platform fat jars, built on each OS with
# packaging/jpackage.sh. Pushing a v* tag (e.g. v2.0.0, which must match the pom version) publishes
# them as a GitHub Release with generated notes. Running it by hand (workflow_dispatch) builds them
# as workflow artifacts; give it an existing v* tag to build that tag and publish it as well (adding
# the files to the tag's release if it already exists), e.g. when the tag push started no run.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and publish (empty: build the selected branch, publish nothing)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            type: deb
          - os: windows-latest
            platform: windows
            type: msi
          # One dmg per Mac architecture: macos-latest is Apple silicon, macos-15-intel is the
          # Intel (x86_64) image. The platform names the files and must match `uname -m`.
          - os: macos-latest
            platform: macos-arm64
            type: dmg
          - os: macos-15-intel
            platform: macos-x86_64
            type: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Read the project version
        id: version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then MVNW=./mvnw.cmd; else MVNW=./mvnw; fi
          echo "version=$($MVNW -q -B help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      # verify = unit tests and coverage floor, then the fat jar (JavaFX natives of this OS only)
      - name: Build and test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ./mvnw.cmd -B verify; else ./mvnw -B verify; fi

      # jpackage (JDK 21) builds msi files with WiX Toolset 3, which recent runner images may lack
      - name: Install WiX Toolset 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 --no-progress -y
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build the ${{ matrix.type }} installer
        shell: bash
        run: packaging/jpackage.sh ${{ matrix.type }}

      - name: Collect the release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir dist
          if [[ "$PLATFORM" == macos-* && "$PLATFORM" != "macos-$(uname -m)" ]]; then
            echo "Runner architecture $(uname -m) does not match the platform $PLATFORM"
            exit 1
          fi
          for file in target/installer/*; do
            name="$(basename "$file")"
            # jpackage's dmg name does not say which Macs it is for
            if [[ "$PLATFORM" == macos-* ]]; then name="FlappyBirdNEAT-$VERSION-$PLATFORM.dmg"; fi
            cp "$file" "dist/$name"
          done
          cp target/FlappyBirdNEAT.jar "dist/FlappyBirdNEAT-$VERSION-$PLATFORM.jar"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: package
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check that the tag matches the pom version
        run: |
          version="$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the pom version $version (expected v$version)"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: FlappyBirdNEAT ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
