name: Release

# Native installers (deb, msi, dmg) and per-platform fat jars, built on each OS with
# packaging/jpackage.sh. Pushing a v* tag (e.g. v2.0.0, which must match the pom version) publishes
# them as a GitHub Release with generated notes. Running it by hand (workflow_dispatch) only builds
# them and keeps them as workflow artifacts: nothing is published.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            type: deb
          - os: windows-latest
            platform: windows
            type: msi
          - os: macos-latest
            platform: macos
            type: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Read the project version
        id: version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then MVNW=./mvnw.cmd; else MVNW=./mvnw; fi
          echo "version=$($MVNW -q -B help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      # verify = unit tests and coverage floor, then the fat jar (JavaFX natives of this OS only)
      - name: Build and test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ./mvnw.cmd -B verify; else ./mvnw -B verify; fi

      # jpackage (JDK 21) builds msi files with WiX Toolset 3, which recent runner images may lack
      - name: Install WiX Toolset 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 --no-progress -y
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build the ${{ matrix.type }} installer
        shell: bash
        run: packaging/jpackage.sh ${{ matrix.type }}

      - name: Collect the release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir dist
          for file in target/installer/*; do
            name="$(basename "$file")"
            # jpackage's dmg name does not say which Macs it is for: the runner's architecture
            if [ "$PLATFORM" = "macos" ]; then name="FlappyBirdNEAT-$VERSION-macos-$(uname -m).dmg"; fi
            cp "$file" "dist/$name"
          done
          cp target/FlappyBirdNEAT.jar "dist/FlappyBirdNEAT-$VERSION-$PLATFORM.jar"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check that the tag matches the pom version
        run: |
          version="$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the pom version $version (expected v$version)"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: FlappyBirdNEAT ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
