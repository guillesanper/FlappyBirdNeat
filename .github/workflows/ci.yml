name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting (Spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check formatting
        run: ./mvnw -B spotless:check

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # verify = compile, unit tests, JaCoCo report + coverage floor, fat jar
      - name: Build, test and check coverage
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ./mvnw.cmd -B verify; else ./mvnw -B verify; fi

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  cli-smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build the fat jar
        run: ./mvnw -B package -DskipTests -Djacoco.skip=true

      # A short headless run per engine: the CSV must have a header plus one row per generation,
      # the summary must report the seed, and no JavaFX class may be loaded on the way
      - name: Run short headless trainings
        run: |
          for engine in neat ga; do
            java -Xlog:class+load=info:file="classes-$engine.log" \
              -jar target/FlappyBirdNEAT-1.0-SNAPSHOT.jar --headless --engine "$engine" \
              --seed 42 --generations 5 --population 20 --threads 2 --out "smoke-$engine.csv" > "smoke-$engine.log"
            test "$(head -n 1 "smoke-$engine.csv")" = 'generation,best,mean,min,species,diversity,frames,wall_ms,nodes,connections,solved'
            test "$(wc -l < "smoke-$engine.csv")" -eq 6
            grep -q 'Seed:          42' "smoke-$engine.log"
            grep -q 'com.neat.flappybirdneat.simulation.TrainingEngine' "classes-$engine.log"
            if grep -q 'javafx' "classes-$engine.log"; then echo "JavaFX was loaded in headless mode"; exit 1; fi
            cat "smoke-$engine.csv"
          done

      - name: Invalid arguments exit with status 2
        run: |
          set +e
          java -jar target/FlappyBirdNEAT-1.0-SNAPSHOT.jar --headless --engine bogus --out x.csv
          test $? -eq 2

      - name: Upload smoke-test CSVs
        uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-csv
          path: smoke-*.csv

  coverage-badge:
    name: Update coverage badge
    needs: [ format, build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Generate badges
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: true

      - name: Commit badges if they changed
        run: |
          if [ -n "$(git status --porcelain .github/badges)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges
            git commit -m "ci: update coverage badges [skip ci]"
            git push
          fi
