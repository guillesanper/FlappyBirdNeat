name: NEAT vs GA study (reduced)

# Manual only: a small version of the published study (docs/results/REPORT.md) to check that the
# pipeline (jar -> run_study.sh -> analyze.py) works end to end. It never runs on push or PR.
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Seeds per configuration
        default: '3'
      generations:
        description: Generations per run
        default: '10'
      population:
        description: Agents per generation
        default: '20'
      max_frames:
        description: Frame cap per generation
        default: '5000'

permissions:
  contents: read

jobs:
  study:
    name: Reduced study
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/requirements.txt

      - name: Build the fat jar
        run: ./mvnw -B package -DskipTests -Djacoco.skip=true

      - name: Run the study
        env:
          SEEDS: ${{ inputs.seeds }}
          GENERATIONS: ${{ inputs.generations }}
          POPULATION: ${{ inputs.population }}
          MAX_FRAMES: ${{ inputs.max_frames }}
          OUT_DIR: study
        run: experiments/run_study.sh

      - name: Analyze
        shell: bash
        run: |
          pip install -r experiments/requirements.txt
          mkdir -p study/analysis
          python experiments/analyze.py --input study --output study/analysis | tee study/analysis/summary.txt

      - name: Upload CSVs and figures
        uses: actions/upload-artifact@v4
        with:
          name: neat-vs-ga-study
          path: |
            study/raw/
            study/manifest.json
            study/timings.csv
            study/analysis/
