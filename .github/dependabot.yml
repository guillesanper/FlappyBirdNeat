version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for test-only dependencies, one for build plugins
      junit:
        patterns: [ "org.junit*" ]
      maven-plugins:
        patterns: [ "*maven-plugin*", "com.diffplug.spotless*", "org.jacoco*" ]
    ignore:
      # JavaFX majors need a JDK/runtime review; take patch and minor updates only
      - dependency-name: "org.openjfx:*"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
